<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradients -->
    <radialGradient id="stageGlow" cx="50%" cy="58%" r="65%">
      <stop offset="0%" stop-color="#142c6e" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0a1638" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#030818" stop-opacity="1" />
      <stop offset="100%" stop-color="#01030a" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b829ff" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="stageBeamL" x1="0%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0066ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="stageBeamR" x1="100%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#b829ff" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2354" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1a3b8b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#071430" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space background base -->
  <rect width="1920" height="1080" fill="url(#stageGlow)" />

  <!-- Grid Perspective Ceiling -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="960" y1="200" x2="0" y2="0" />
    <line x1="960" y1="200" x2="300" y2="0" />
    <line x1="960" y1="200" x2="600" y2="0" />
    <line x1="960" y1="200" x2="960" y2="0" />
    <line x1="960" y1="200" x2="1320" y2="0" />
    <line x1="960" y1="200" x2="1620" y2="0" />
    <line x1="960" y1="200" x2="1920" y2="0" />
    <!-- horizontal ceiling trusses -->
    <line x1="150" y1="30" x2="1770" y2="30" />
    <line x1="320" y1="70" x2="1600" y2="70" />
    <line x1="520" y1="120" x2="1400" y2="120" />
    <line x1="720" y1="160" x2="1200" y2="160" />
  </g>

  <!-- Spotlights / Stage Light Beams -->
  <polygon points="120,0 260,0 900,680 750,680" fill="url(#stageBeamL)" opacity="0.75" />
  <polygon points="1800,0 1660,0 1020,680 1170,680" fill="url(#stageBeamR)" opacity="0.75" />
  <polygon points="450,0 520,0 960,650 900,650" fill="url(#stageBeamL)" opacity="0.5" />
  <polygon points="1470,0 1400,0 960,650 1020,650" fill="url(#stageBeamR)" opacity="0.5" />

  <!-- Center Stage Back Curved Curved LED Wall -->
  <path d="M 280,560 Q 960,460 1640,560 L 1680,680 Q 960,590 240,680 Z" fill="url(#screenGrad)" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- LED Wall Digital Content / Skyline Graphics -->
  <g opacity="0.45">
    <rect x="400" y="500" width="35" height="70" fill="#38bdf8" />
    <rect x="445" y="470" width="50" height="100" fill="#60a5fa" />
    <rect x="510" y="510" width="40" height="60" fill="#818cf8" />
    <rect x="560" y="460" width="60" height="110" fill="#38bdf8" />
    <rect x="635" y="480" width="45" height="90" fill="#c084fc" />
    <rect x="700" y="440" width="70" height="130" fill="#60a5fa" />
    <rect x="785" y="470" width="55" height="100" fill="#38bdf8" />
    <rect x="855" y="430" width="80" height="140" fill="#818cf8" />
    <rect x="950" y="420" width="85" height="150" fill="#38bdf8" />
    <rect x="1050" y="450" width="70" height="120" fill="#c084fc" />
    <rect x="1135" y="430" width="60" height="140" fill="#60a5fa" />
    <rect x="1210" y="480" width="50" height="90" fill="#38bdf8" />
    <rect x="1275" y="460" width="65" height="110" fill="#818cf8" />
    <rect x="1355" y="500" width="45" height="70" fill="#c084fc" />
    <rect x="1415" y="470" width="55" height="100" fill="#38bdf8" />
    <rect x="1485" y="520" width="40" height="50" fill="#60a5fa" />
  </g>

  <!-- Glowing LED Edge Strips -->
  <path d="M 240,680 Q 960,590 1680,680" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" />
  <path d="M 280,560 Q 960,460 1640,560" fill="none" stroke="#b829ff" stroke-width="2" filter="url(#glow)" />

  <!-- Stage Platform & Floor Reflections -->
  <polygon points="180,680 1740,680 1920,1080 0,1080" fill="#040918" opacity="0.95" />
  
  <!-- Perspective Floor Grid on Stage -->
  <g opacity="0.25" stroke="#0284c7" stroke-width="1.2">
    <!-- radiating floor lines -->
    <line x1="960" y1="630" x2="0" y2="1080" />
    <line x1="960" y1="630" x2="300" y2="1080" />
    <line x1="960" y1="630" x2="600" y2="1080" />
    <line x1="960" y1="630" x2="800" y2="1080" />
    <line x1="960" y1="630" x2="960" y2="1080" />
    <line x1="960" y1="630" x2="1120" y2="1080" />
    <line x1="960" y1="630" x2="1320" y2="1080" />
    <line x1="960" y1="630" x2="1620" y2="1080" />
    <line x1="960" y1="630" x2="1920" y2="1080" />
    <!-- concentric circular stage rings -->
    <ellipse cx="960" cy="690" rx="400" ry="40" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.7" />
    <ellipse cx="960" cy="740" rx="580" ry="60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" />
    <ellipse cx="960" cy="810" rx="780" ry="85" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.4" />
    <ellipse cx="960" cy="910" rx="1050" ry="120" fill="none" stroke="#00f2fe" stroke-width="1" opacity="0.3" />
    <ellipse cx="960" cy="1040" rx="1380" ry="160" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.2" />
  </g>

  <!-- Glowing Stage Halo & Tech Rings -->
  <ellipse cx="960" cy="685" rx="360" ry="32" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)" />
  <circle cx="960" cy="650" r="18" fill="#00f2fe" opacity="0.7" filter="url(#glow)" />
  <circle cx="820" cy="660" r="10" fill="#b829ff" opacity="0.6" filter="url(#softGlow)" />
  <circle cx="1100" cy="660" r="10" fill="#00f2fe" opacity="0.6" filter="url(#softGlow)" />

  <!-- Ambient Digital Floating Sparks / Particles -->
  <g opacity="0.6">
    <circle cx="480" cy="350" r="2.5" fill="#00f2fe" />
    <circle cx="560" cy="280" r="1.5" fill="#ffffff" />
    <circle cx="720" cy="310" r="2" fill="#c084fc" />
    <circle cx="850" cy="240" r="3" fill="#38bdf8" filter="url(#softGlow)" />
    <circle cx="920" cy="320" r="2" fill="#ffffff" />
    <circle cx="1080" cy="270" r="2.5" fill="#00f2fe" />
    <circle cx="1200" cy="340" r="1.8" fill="#c084fc" />
    <circle cx="1380" cy="290" r="2" fill="#38bdf8" />
    <circle cx="1520" cy="360" r="3" fill="#00f2fe" filter="url(#softGlow)" />
  </g>
</svg>
